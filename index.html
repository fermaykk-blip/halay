<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaya Katıl 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  #sahne{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:0 auto;container-type:size;overflow:hidden}
  #sahne canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .anton{font-family:Anton,Impact,'Arial Black',sans-serif;paint-order:stroke fill}
  #sayac{position:absolute;right:3cqw;top:9cqh;font-size:5.6cqw;color:#fff;-webkit-text-stroke:.6cqw #000;letter-spacing:.1cqw}
  #panel{position:absolute;right:2cqw;top:13.5cqh;width:30cqw;background:rgba(25,18,30,.6);border-radius:2cqw;padding:.6cqw 1.4cqw;backdrop-filter:blur(3px)}
  .satir{display:flex;align-items:center;gap:1.4cqw;padding:.45cqw 0;color:#fff;font-size:2.5cqw;font-weight:700;text-shadow:0 0 .5cqw #000;white-space:nowrap}
  .ikon{width:4.2cqw;text-align:center;font-size:3.6cqw;line-height:1}
  .jeton{min-width:5cqw;text-align:right;font-size:2.2cqw;color:#ffd43b}
  #banner{position:absolute;left:0;right:0;top:20cqh;text-align:center;pointer-events:none;opacity:0;transform:scale(.5)}
  #banner.acik{opacity:1;transform:scale(1);transition:opacity .2s,transform .45s cubic-bezier(.2,1.7,.4,1)}
  #b1{font-size:12cqw;color:#ffd43b;-webkit-text-stroke:1.3cqw #3a1600;text-shadow:0 .8cqw 2cqw rgba(0,0,0,.6);line-height:1.05}
  #b2{font-size:8cqw;color:#fff;-webkit-text-stroke:1cqw #000;margin-top:.4cqh}
  #foto{position:absolute;right:5cqw;top:36cqh;width:17cqw;height:17cqw;border-radius:50%;border:1cqw solid #ffd43b;box-shadow:0 0 4cqw rgba(255,212,59,.6);object-fit:cover;opacity:0;transition:opacity .3s;background:#222}
  #akis{position:absolute;left:3cqw;top:47cqh;display:flex;flex-direction:column;gap:.7cqh}
  #akis div{font-size:4.4cqw;color:#ffd43b;-webkit-text-stroke:.5cqw #000;line-height:1.1;animation:gir .35s ease-out}
  #akis small{display:block;font-family:system-ui,sans-serif;font-weight:800;font-size:3cqw;color:#fff;-webkit-text-stroke:0;text-shadow:0 0 .7cqw #000,0 0 .7cqw #000}
  @keyframes gir{from{transform:translateX(-12cqw);opacity:0}}
  #taht{position:absolute;left:2cqw;top:9cqh;max-width:52cqw;background:rgba(25,18,30,.72);border:.4cqw solid #ffd43b;border-radius:2cqw;padding:1cqw 2cqw;color:#fff;font-weight:800;font-size:2.6cqw;text-shadow:0 0 .4cqw #000}
  #taht .t1{font-family:Anton,Impact,sans-serif;color:#ffd43b;font-size:3.6cqw;letter-spacing:.1cqw}
  #taht .t3{font-size:2.2cqw;opacity:.9;margin-top:.4cqw}
  #hedef{position:absolute;left:3cqw;right:3cqw;top:16.5cqh;height:4.4cqw;background:rgba(0,0,0,.55);border:.3cqw solid rgba(255,255,255,.25);border-radius:2.2cqw;overflow:hidden}
  #hedef i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff4d6d,#ffd43b);transition:width .5s}
  #hedef span{position:relative;display:block;text-align:center;line-height:4.4cqw;font-weight:900;font-size:2.5cqw;color:#fff;text-shadow:0 0 .5cqw #000}
  #durum{position:absolute;left:2cqw;right:2cqw;bottom:.8cqh;font-size:2.2cqw;font-weight:700;color:#ff8787;text-shadow:0 0 .6cqw #000}
</style>
</head>
<body>
<div id="sahne">
  <div id="sayac" class="anton">HALAY 0 KİŞİ</div>
  <div id="taht"></div>
  <div id="hedef"><i></i><span></span></div>
  <div id="banner"><div id="b1" class="anton"></div><div id="b2" class="anton"></div></div>
  <img id="foto" alt="">
  <div id="akis" class="anton"></div>
  <div id="durum"></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ======================= AYARLAR (sadece burayı değiştir) ======================= */
const AYAR = {
  wsAdres: 'ws://localhost:21213/',   // TikFinity WebSocket adresi
  yorumlaKatil: true,                 // yorum yazan halaya girsin mi
  katilmaKelimesi: '',                // boş = her yorum. 'katıl' yazarsan sadece "katıl" yazan girer
  begeniIleKatil: false,              // beğeni atan girsin mi (çok kalabalık yapar)
  takipIleKatil: true,                // takip eden girsin mi
  // Hediye → ne olacak. "hediye" TikTok'taki İngilizce hediye adı (TikFinity'de görünür).
  // Adı eşleşmeyen hediyeler jeton değerine göre en yakın alt seçeneğe düşer.
  hediyeler: [
    { aksiyon: 'katil',   yazi: 'halaya katıl',      emoji: '🌹', hediye: 'Rose',            jeton: 1   },
    { aksiyon: 'zipla',   yazi: 'herkes zıplasın',   emoji: '🦘', hediye: 'Ice Cream Cone',  jeton: 1   },
    { aksiyon: 'kalp',    yazi: 'kalp yağmuru',      emoji: '💖', hediye: 'Finger Heart',    jeton: 5   },
    { aksiyon: 'konfeti', yazi: 'konfeti patlat',    emoji: '🎉', hediye: 'Rosa',            jeton: 10  },
    { aksiyon: 'hizlan',  yazi: 'halay hızlansın',   emoji: '⚡', hediye: 'Perfume',         jeton: 20  },
    { aksiyon: 'damat',   yazi: 'damat ol',          emoji: '🤵', hediye: 'Doughnut',        jeton: 30  },
    { aksiyon: 'havai',   yazi: 'havai fişek',       emoji: '🎆', hediye: 'Sunglasses',      jeton: 50  },
    { aksiyon: 'gelin',   yazi: 'gelin ol',          emoji: '👰', hediye: 'Paper Crane',     jeton: 99  },
    { aksiyon: 'davul',   yazi: 'davulcu ol',        emoji: '🥁', hediye: 'Hand Hearts',     jeton: 100 },
    { aksiyon: 'zurna',   yazi: 'zurnacı ol',        emoji: '🎺', hediye: 'Confetti',        jeton: 100 },
    { aksiyon: 'dev',     yazi: 'dev ol (1 dk)',     emoji: '🦍', hediye: 'Corgi',           jeton: 150 },
    { aksiyon: 'para',    yazi: 'para yağmuru',      emoji: '💸', hediye: 'Money Gun',       jeton: 199 },
    { aksiyon: 'altin',   yazi: 'altın kostüm',      emoji: '👑', hediye: 'Swan',            jeton: 299 },
  ],
  // Halaybaşı: yayında EN ÇOK jeton gönderen kişi olur (geçmek için 1 jeton fazlası yeter).
  hedefJeton: 100,        // ortak hedef: bu kadar jeton birikince havai fişek şovu (her seferinde 1,5 katına çıkar)
  maxDansci: 45,          // halkadaki en fazla kişi
  figuran: 12,             // yayın boş görünmesin diye isimsiz figüran sayısı (gerçek kişi gelince çıkarlar)
  bpm: 108,               // davul hızı (müzik dosyası kullanırsan ona göre ayarla)
  zurna: false,            // davulun üstüne telifsiz zurna ezgileri (3 ezgi sırayla çalar)
  muzik: 'muzik.mp3',     // sitedeki müzik dosyası; sürekli başa sararak çalar
};
/* ================================================================================ */

const $ = id => document.getElementById(id);
const sahneEl = $('sahne');
const PI = Math.PI;

/* ---------- Temel kurulum ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
sahneEl.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3a2440, 30, 75);
const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.1, 200);
function boyut() {
  const r = sahneEl.getBoundingClientRect();
  renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);   // her zaman tam HD çiz
  camera.aspect = 9 / 16; camera.updateProjectionMatrix();
}
addEventListener('resize', boyut); boyut();

function tuval(w, h, ciz) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; ciz(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
// gökyüzü
scene.background = tuval(4, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#120c2e'); g.addColorStop(.45, '#4a2a5e'); g.addColorStop(.75, '#c4605a'); g.addColorStop(1, '#f2a65e');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
});

// ışıklar
scene.add(new THREE.HemisphereLight(0xb79ae6, 0x5a3820, 1.1));
const gunes = new THREE.DirectionalLight(0xffc28a, 2.4);
gunes.position.set(-14, 20, 10); gunes.castShadow = true;
gunes.shadow.mapSize.set(2048, 2048);
Object.assign(gunes.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
gunes.shadow.bias = -0.0004; gunes.shadow.normalBias = 0.03;
scene.add(gunes);
for (let i = 0; i < 4; i++) {
  const p = new THREE.PointLight(0xffa850, 25, 26, 1.4);
  p.position.set(Math.cos(i * PI / 2 + .6) * 8, 4.5, Math.sin(i * PI / 2 + .6) * 8); scene.add(p);
}

/* ---------- Malzeme / geometri yardımcıları ---------- */
const mc = new Map(), gc = new Map();
function M(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!mc.has(k)) mc.set(k, new THREE.MeshStandardMaterial({ color, roughness: .85, ...o }));
  return mc.get(k);
}
function GEO(k, f) { if (!gc.has(k)) gc.set(k, f()); return gc.get(k); }
const cap = (r, l) => GEO('c' + r + l, () => new THREE.CapsuleGeometry(r, l, 4, 12));
const box = (a, b, c) => GEO('b' + a + b + c, () => new THREE.BoxGeometry(a, b, c));
const sph = (r) => GEO('s' + r, () => new THREE.SphereGeometry(r, 18, 14));
const cyl = (a, b, h, s = 18) => GEO('y' + a + b + h + s, () => new THREE.CylinderGeometry(a, b, h, s));
function mesh(geo, mat, par, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; par.add(m); return m;
}
function rastgele(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

/* ---------- Mekân: köy meydanı ---------- */
const tasDoku = tuval(512, 512, (x) => {
  x.fillStyle = '#3d2a1c'; x.fillRect(0, 0, 512, 512);
  for (let r = 0; r < 8; r++) for (let k = -1; k < 8; k++) {
    const off = r % 2 ? 32 : 0, l = 30 + Math.random() * 14;
    x.fillStyle = `hsl(${20 + Math.random() * 12},${28 + Math.random() * 14}%,${l}%)`;
    x.fillRect(k * 64 + off + 2, r * 64 + 2, 60, 60);
  }
});
tasDoku.wrapS = tasDoku.wrapT = THREE.RepeatWrapping; tasDoku.repeat.set(30, 30);
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: tasDoku, roughness: .95 }));
zemin.rotation.x = -PI / 2; zemin.receiveShadow = true; scene.add(zemin);

// evler
const pencereMat = new THREE.MeshStandardMaterial({ color: 0xffc070, emissive: 0xffa040, emissiveIntensity: 1.6 });
const kapiMat = M('#3b2414');
for (let i = 0; i < 14; i++) {
  const a = i / 14 * PI * 2 + Math.random() * .1, r = 20 + Math.random() * 3;
  const w = 5 + Math.random() * 2.5, h = 3.5 + Math.random() * 3, d = 5;
  const ev = new THREE.Group(); ev.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  ev.rotation.y = Math.atan2(-ev.position.x, -ev.position.z); scene.add(ev);
  mesh(box(w, h, d), M(['#a8865e', '#b89a74', '#9a7650', '#c2a27c', '#8f6e4c'][i % 5]), ev, 0, h / 2, 0);
  mesh(box(w + .3, .25, d + .3), M('#6e5038'), ev, 0, h + .1, 0);
  mesh(box(1, 2, .05), kapiMat, ev, -w / 4, 1, d / 2 + .02);
  for (let k = 0; k < (h > 5 ? 2 : 1); k++) {
    mesh(box(.8, .9, .05), pencereMat, ev, w / 4, 1.6 + k * 2, d / 2 + .02);
    if (k) mesh(box(.8, .9, .05), pencereMat, ev, -w / 4, 1.6 + k * 2, d / 2 + .02);
  }
}
// masa sandalye
const beyaz = M('#f2f2ee', { roughness: .5 });
for (let i = 0; i < 7; i++) {
  const a = i / 7 * PI * 2 + .25, r = 15 + Math.random() * 1.5;
  const g = new THREE.Group(); g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); g.rotation.y = Math.random() * 6; scene.add(g);
  mesh(cyl(.6, .6, .05, 20), beyaz, g, 0, .74, 0); mesh(cyl(.05, .08, .72, 8), beyaz, g, 0, .36, 0);
  for (let s = 0; s < 3; s++) {
    const c = new THREE.Group(); const b = s / 3 * PI * 2; c.position.set(Math.cos(b) * 1, 0, Math.sin(b) * 1);
    c.rotation.y = Math.atan2(-c.position.x, -c.position.z); g.add(c);
    mesh(box(.45, .05, .45), beyaz, c, 0, .45, 0); mesh(box(.45, .5, .04), beyaz, c, 0, .72, -.22);
    for (const [x, z] of [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]]) mesh(box(.035, .45, .035), beyaz, c, x, .22, z);
  }
}
// direkler + ampuller
const ampuller = [];
const direkN = 10, direkR = 12.5, direkH = 4.6;
const direkPos = [];
for (let i = 0; i < direkN; i++) {
  const a = i / direkN * PI * 2; const p = new THREE.Vector3(Math.cos(a) * direkR, direkH, Math.sin(a) * direkR);
  direkPos.push(p); mesh(cyl(.07, .09, direkH, 8), M('#4a3322'), scene, p.x, direkH / 2, p.z);
}
const telMat = new THREE.LineBasicMaterial({ color: 0x111111 });
function zincir(a, b, n, sark) {
  const pts = [];
  for (let i = 0; i <= 24; i++) { const u = i / 24; const p = a.clone().lerp(b, u); p.y -= Math.sin(u * PI) * sark; pts.push(p); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), telMat));
  for (let i = 1; i < n; i++) { const u = i / n; const p = a.clone().lerp(b, u); p.y -= Math.sin(u * PI) * sark + .08; ampuller.push(p); }
}
for (let i = 0; i < direkN; i++) zincir(direkPos[i], direkPos[(i + 1) % direkN], 9, .7);
for (let i = 0; i < 3; i++) zincir(direkPos[i], direkPos[i + 5], 26, 1.1);
const AMPUL_RENK = [0xffd43b, 0xff6b6b, 0x69db7c, 0x74c0fc, 0xffa94d].map(c => new THREE.Color(c));
const ampulMesh = new THREE.InstancedMesh(sph(.075), new THREE.MeshBasicMaterial(), ampuller.length);
const tmpM = new THREE.Matrix4();
ampuller.forEach((p, i) => { tmpM.makeTranslation(p.x, p.y, p.z); ampulMesh.setMatrixAt(i, tmpM); ampulMesh.setColorAt(i, AMPUL_RENK[i % 5]); });
scene.add(ampulMesh);
const sonuk = new THREE.Color(0x554433);
function ampulGuncelle(vurus) {
  const v = Math.floor(vurus);
  for (let i = 0; i < ampuller.length; i++) ampulMesh.setColorAt(i, (i + v) % 4 === 0 ? sonuk : AMPUL_RENK[i % 5]);
  ampulMesh.instanceColor.needsUpdate = true;
}

/* ---------- Karakter ---------- */
const TEN = ['#f1c9a5', '#e3b088', '#c99067', '#a8704a', '#f6d8bc'];
const YELEK = ['#1f3d2b', '#151515', '#3b1d4f', '#5b1a1a', '#1d2b4f', '#4a3a18'];
const ELBISE = ['#c2185b', '#d81b60', '#7b1fa2', '#00897b', '#e53935', '#3949ab', '#f4511e', '#2e7d32'];
const ESARP = ['#ffffff', '#f8bbd0', '#fff3c4', '#e1bee7', '#b2ebf2', '#c62828', '#1a237e'];
const pusiDoku = tuval(64, 64, (x) => {
  x.fillStyle = '#f4f1ea'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#151515';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2 === 0) x.fillRect(i * 8 + 2, j * 8 + 2, 4, 4);
  x.fillRect(0, 30, 64, 3); x.fillRect(30, 0, 3, 64);
});
pusiDoku.wrapS = pusiDoku.wrapT = THREE.RepeatWrapping; pusiDoku.repeat.set(3, 3);
const pusiMat = new THREE.MeshStandardMaterial({ map: pusiDoku, roughness: .9 });
const altin = M('#e0b440', { metalness: .8, roughness: .3 });
const siyah = M('#141414');

const desenDoku = tuval(128, 128, (x) => {         // elbise deseni (çiçek/nokta), renkle çarpılır
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const cx = i * 32 + (j % 2) * 16 + 8, cy = j * 32 + 8;
    x.fillStyle = '#d9d9d9'; for (let k = 0; k < 5; k++) { const a = k / 5 * PI * 2; x.beginPath(); x.arc(cx + Math.cos(a) * 4, cy + Math.sin(a) * 4, 3, 0, PI * 2); x.fill(); }
    x.fillStyle = '#fff6c8'; x.beginPath(); x.arc(cx, cy, 2.2, 0, PI * 2); x.fill();
  }
  x.fillStyle = '#c9c9c9'; x.fillRect(0, 120, 128, 4);
});
desenDoku.wrapS = desenDoku.wrapT = THREE.RepeatWrapping; desenDoku.repeat.set(5, 3);
const desenMat = new Map();
const DM = (renk) => { if (!desenMat.has(renk)) desenMat.set(renk, new THREE.MeshStandardMaterial({ color: renk, map: desenDoku, roughness: .8 })); return desenMat.get(renk); };
const lathe = (k, pts, seg = 20) => GEO(k, () => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg));
const kcyl = (a, b, h) => cyl(a, b, h, 12);
const beyazGoz = M('#fbfbfb', { roughness: .3 }), agizMat = M('#7a2a2a'), yanak = M('#ff8a8a', { transparent: true, opacity: .35 });

function karakter(seed, cins, tip = 'normal') {
  const R = rastgele(seed), sec = a => a[Math.floor(R() * a.length)];
  const tenR = sec(TEN), ten = M(tenR);
  const kadin = cins === 'k';
  let kol, govde, pant, cizme = siyah;
  if (tip === 'altin') { govde = kol = pant = cizme = M('#f5c542', { metalness: .9, roughness: .25, emissive: '#4a3000' }); }
  else if (tip === 'gelin') { govde = kol = M('#fbfbfb', { roughness: .6 }); }
  else if (tip === 'damat') { govde = kol = pant = M('#17171c', { roughness: .6 }); }
  else if (kadin) { govde = kol = DM(sec(ELBISE)); }
  else { govde = M(sec(YELEK)); kol = M(sec(['#f3efe6', '#ffffff', '#e8e1d0'])); pant = M(R() < .7 ? '#1c1c1c' : '#3b2f25'); }
  const sus = (o) => { o.castShadow = false; return o; };   // küçük parçalar gölge düşürmesin (performans)

  const root = new THREE.Group();
  const hip = new THREE.Group(); hip.position.y = .95; root.add(hip);
  const bacak = [];
  for (const s of [-1, 1]) {
    const th = new THREE.Group(); th.position.x = .095 * s; hip.add(th);
    const kn = new THREE.Group(); kn.position.y = -.45; th.add(kn);
    if (!kadin) {
      const bol = tip === 'damat' ? 0 : .035;          // şalvar bolluğu
      mesh(kcyl(.095 + bol, .07 + bol * .6, .46), pant, th, 0, -.22, 0);
      mesh(sph(.07 + bol * .5), pant, kn, 0, 0, 0);
      mesh(kcyl(.068, .052, .42), tip === 'damat' ? pant : cizme, kn, 0, -.21, 0);
    } else mesh(kcyl(.05, .04, .42), ten, kn, 0, -.21, 0);
    const ayak = mesh(sph(.065), siyah, kn, 0, -.45, .045); ayak.scale.set(.85, .55, 1.6);
    bacak.push({ th, kn });
  }
  const spine = new THREE.Group(); spine.position.y = .0; hip.add(spine);
  const gogus = new THREE.Group(); spine.add(gogus);
  const tors = mesh(kadin
    ? lathe('gK', [[0, 0], [.15, 0], [.14, .1], [.125, .18], [.15, .3], [.162, .37], [.15, .45], [.1, .52], [0, .53]])
    : lathe('gE', [[0, 0], [.155, 0], [.16, .06], [.148, .16], [.165, .3], [.185, .41], [.175, .47], [.11, .53], [0, .54]]), govde, gogus, 0, .02, 0);
  tors.scale.z = .74;
  if (kadin) {

  P.forEach((k, i) => { im.setColorAt(i, renkler[i % renkler.length]); tmpM.makeScale(0, 0, 0); im.setMatrixAt(i, tmpM); });
  let idx = 0;
  return {
    ekle(x, y, z, vx, vy, vz, life) {
      const k = P[idx = (idx + 1) % N]; k.p.set(x, y, z); k.v.set(vx, vy, vz); k.life = life;
      k.w.set(Math.random() * o.don, Math.random() * o.don, Math.random() * o.don);
    },
    guncelle(dt) {

          k.r.x += k.w.x * dt; k.r.y += k.w.y * dt; k.r.z += k.w.z * dt;

const konfeti = parcacik(new THREE.PlaneGeometry(.09, .05), renk([0xff4d6d, 0xffd43b, 0x69db7c, 0x4dabf7, 0xda77f2, 0xffffff]), 700, { don: 12, g: 9, surt: .2, min: -1.2 });
const kalpSekil = new THREE.Shape();
kalpSekil.moveTo(0, -.5); kalpSekil.bezierCurveTo(-.1, -.35, -.6, -.1, -.6, .2); kalpSekil.bezierCurveTo(-.6, .55, -.15, .6, 0, .3);
kalpSekil.bezierCurveTo(.15, .6, .6, .55, .6, .2); kalpSekil.bezierCurveTo(.6, -.1, .1, -.35, 0, -.5);
const kalpGeo = new THREE.ShapeGeometry(kalpSekil); kalpGeo.scale(.22, .22, .22);
const kalpler = parcacik(kalpGeo, renk([0xff2d55, 0xff6b9a, 0xe0115f, 0xff8fab]), 400, { don: 2, g: 2, surt: .5, min: -1.5, son: 1 });
const paraDoku = tuval(128, 64, (x) => {
  x.fillStyle = '#4f9a5a'; x.fillRect(0, 0, 128, 64); x.strokeStyle = '#d8f0c8'; x.lineWidth = 4; x.strokeRect(5, 5, 118, 54);
  x.fillStyle = '#e8f7dc'; x.font = 'bold 36px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('₺200', 64, 34);
});
const paralar = parcacik(new THREE.PlaneGeometry(.26, .13), renk([0xffffff]), 500, { don: 5, g: 3, surt: .4, min: -1.3, mat: { map: paraDoku } });
const havai = parcacik(sph(.07), renk([0xffd43b, 0xff4d6d, 0x4dabf7, 0x69db7c, 0xda77f2, 0xffffff, 0xff922b]), 1200, { don: 0, g: 2.5, surt: .35, min: -99, son: 1.2, mat: { blending: THREE.AdditiveBlending, transparent: true, depthWrite: false } });
let sonHavai = 0;
function yagmur(sis, n, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * PI * 2, r = Math.sqrt(Math.random()) * (R + 3);
    sis.ekle(Math.cos(a) * r, 8 + Math.random() * 3, Math.sin(a) * r, (Math.random() - .5), -1, (Math.random() - .5), life);
  }
}
function efektGuncelle(t, dt) {
  if (t < kalpBitis) yagmur(kalpler, 3, 7);
  if (t < paraBitis) yagmur(paralar, 4, 8);
  if (t < havaiBitis && t - sonHavai > .35) {
    sonHavai = t;
    const a = Math.random() * PI * 2, r = Math.random() * R, y = 11 + Math.random() * 5;
    for (let i = 0; i < 110; i++) {
      kv.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(5 + Math.random() * 3);
      havai.ekle(Math.cos(a) * r, y, Math.sin(a) * r, kv.x, kv.y, kv.z, 1.4 + Math.random() * .6);
    }
    if (sesAcik && ses) patla();
  }
  konfeti.guncelle(dt); kalpler.guncelle(dt); paralar.guncelle(dt); havai.guncelle(dt);
}

/* ---------- TikFinity ---------- */
let bagli = false;
function hediyeBul(v) {
  const ad = String(v.giftName || '').toLowerCase();
  const h = AYAR.hediyeler.find(x => x.hediye.toLowerCase() === ad); if (h) return h;
  const jet = (v.diamondCount || 0) * (v.repeatCount || 1);
  return [...AYAR.hediyeler].sort((a, b) => b.jeton - a.jeton).find(x => jet >= x.jeton) || AYAR.hediyeler[0];
}
function baglan() {
  let ws; try { ws = new WebSocket(AYAR.wsAdres); } catch { setTimeout(baglan, 3000); return; }
  ws.onopen = () => { bagli = true; durumYaz(); };
  ws.onclose = () => { bagli = false; durumYaz(); setTimeout(baglan, 3000); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    const tur = m.event || m.type, v = m.data || {};
    const k = { id: v.uniqueId || v.userId, ad: (v.nickname || v.uniqueId || '').slice(0, 16), foto: v.profilePictureUrl };
    if (tur === 'chat') {
      const y = (v.comment || '').toLocaleLowerCase('tr');
      if (/\b(kız|kadın|bayan)\b/.test(y)) k.cins = 'k'; else if (/\b(erkek|bay)\b/.test(y)) k.cins = 'e';
      if (AYAR.yorumlaKatil && (!AYAR.katilmaKelimesi || y.includes(AYAR.katilmaKelimesi.toLocaleLowerCase('tr')))) uygula('katil', k);
    } else if (tur === 'like' && AYAR.begeniIleKatil) uygula('katil', k);
    else if (tur === 'follow' && AYAR.takipIleKatil) uygula('katil', k);
    else if (tur === 'gift') {
      if (v.giftType === 1 && !v.repeatEnd) return;
      const h = hediyeBul(v); uygula(h.aksiyon, k);
      hediyeGeldi(k, (v.diamondCount || 0) * (v.repeatCount || 1) || h.jeton);
    }
  };
}
function durumYaz() {
  $('durum').textContent = bagli ? '' : '● TikFinity bekleniyor — Test: D katıl • 1-9, 0, Q-T hediyeler • M ses';
}
durumYaz(); baglan();


/* ---------- Ses ---------- */
const basla = zaman();
let ses = null, sesAcik = false, muzikEl = null;
function vur(guclu) {
  const z = ses.currentTime, o = ses.createOscillator(), g = ses.createGain();
  o.frequency.setValueAtTime(guclu ? 95 : 190, z); o.frequency.exponentialRampToValueAtTime(guclu ? 42 : 95, z + .15);
  g.gain.setValueAtTime(guclu ? 1 : .35, z); g.gain.exponentialRampToValueAtTime(.001, z + (guclu ? .4 : .12));
  o.connect(g).connect(ses.destination); o.start(z); o.stop(z + .45);
}
function patla() {            // havai fişek sesi
  const z = ses.currentTime, n = ses.createBufferSource(), b = ses.createBuffer(1, ses.sampleRate * .5, ses.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const g = ses.createGain(); g.gain.value = .5; n.buffer = b; n.connect(g).connect(ses.destination); n.start(z);
}
const EZGI = [   // Hicaz makamında, yarım vuruşluk notalar (-1 = sus, 'u' = önceki notayı uzat)
  [7, 'u', 5, 4, 5, 7, 8, 7, 5, 4, 1, 0, 1, 4, 0, -1],
  [0, 1, 4, 5, 7, 'u', 5, 4, 5, 7, 8, 10, 8, 7, 5, -1],
  [12, 10, 8, 7, 8, 10, 12, 'u', 8, 7, 5, 4, 5, 7, 0, -1],
];
function zurnaCal(yarim) {
  const ez = EZGI[Math.floor(yarim / 64) % EZGI.length], n = ez[yarim % 16];
  if (n === -1 || n === 'u') return;
  let uz = 1; for (let i = (yarim % 16) + 1; i < 16 && ez[i] === 'u'; i++) uz++;
  const sn = 30 / AYAR.bpm * uz, z = ses.currentTime, f = 293.66 * Math.pow(2, n / 12);
  const o1 = ses.createOscillator(), o2 = ses.createOscillator(), lfo = ses.createOscillator(), ld = ses.createGain();
  const fl = ses.createBiquadFilter(), g = ses.createGain();
  o1.type = 'sawtooth'; o2.type = 'square'; o1.frequency.value = f; o2.frequency.value = f * 1.003;
  lfo.frequency.value = 6; ld.gain.value = f * .006; lfo.connect(ld); ld.connect(o1.frequency); ld.connect(o2.frequency);
  fl.type = 'bandpass'; fl.frequency.value = 1700; fl.Q.value = .8;
  g.gain.setValueAtTime(0, z); g.gain.linearRampToValueAtTime(.13, z + .03); g.gain.setValueAtTime(.13, z + sn * .85); g.gain.linearRampToValueAtTime(0, z + sn);
  o1.connect(fl); o2.connect(fl); fl.connect(g).connect(ses.destination);
  for (const o of [o1, o2, lfo]) { o.start(z); o.stop(z + sn + .05); }
}
function sesAc() {
  sesAcik = true;
  if (!ses) ses = new (window.AudioContext || window.webkitAudioContext)(); ses.resume();
  if (AYAR.muzik) { if (!muzikEl) { muzikEl = new Audio(AYAR.muzik); muzikEl.loop = true; } muzikEl.play().catch(() => {}); }
}
function sesKapat() { sesAcik = false; muzikEl?.pause(); }

/* ---------- Test tuşları ---------- */
const TEST = ['Ayşe', 'Mehmet', 'Zeynep', 'Can', 'Elif', 'Burak', 'Fatma', 'Emre', 'Deniz', 'Hasan', 'Merve', 'Ali', 'Rojda', 'Baran', 'Dilan', 'Serhat'];
let tn = 0;
const testKisi = () => { tn++; return { id: 'test' + tn, ad: TEST[tn % TEST.length] + (tn > TEST.length ? tn : '') }; };
const rastgeleGercek = () => { const g = dansci.filter(d => !d.figuran); return g.length ? g[Math.floor(Math.random() * g.length)] : testKisi(); };
const TUSLAR = '1234567890qwert';
addEventListener('keydown', e => {
  const t = e.key.toLowerCase();
  if (t === 'd') uygula('katil', testKisi());
  if (t === 'm') sesAcik ? sesKapat() : sesAc();
  const i = TUSLAR.indexOf(t), h = AYAR.hediyeler[i];
  if (i >= 0 && h) { const kisi = ['gelin', 'damat', 'davul', 'zurna'].includes(h.aksiyon) || Math.random() < .4 ? testKisi() : rastgeleGercek(); uygula(h.aksiyon, kisi); hediyeGeldi(kisi, h.jeton); }
});

window.uygula = uygula;

/* ---------- Halaybaşı kapışması + ortak hedef ---------- */
const puan = new Map(); let tahtId = null, hedefT = 0, hedefH = AYAR.hedefJeton;
const kac = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hediyeGeldi(k, jet) {
  if (!k?.id || !jet) return;
  const p = puan.get(k.id) || { ad: k.ad, jeton: 0 }; p.ad = k.ad || p.ad; p.jeton += jet; puan.set(k.id, p);
  const ilk = [...puan.entries()].sort((a, b) => b[1].jeton - a[1].jeton)[0];
  if (ilk[0] !== tahtId) { tahtId = ilk[0]; uygula('bas', { id: ilk[0], ad: ilk[1].ad }); }
  hedefT += jet;
  if (hedefT >= hedefH) { hedefT -= hedefH; hedefH = Math.round(hedefH * 1.5 / 10) * 10; kuyruk.unshift({ tur: 'hedef', d: dansci[0] || muzisyen.davul }); }
  panelYaz();
}
function panelYaz() {
  const s = [...puan.values()].sort((a, b) => b.jeton - a.jeton);
  $('taht').innerHTML = s.length
    ? `<div class="t1">👑 HALAYBAŞI: ${kac(s[0].ad)}</div><div>${s[0].jeton} jeton · tahtı al: ${s[0].jeton + 1}+ jeton</div>` +
      (s.length > 1 ? `<div class="t3">${s.slice(1, 3).map((x, i) => `${i + 2}. ${kac(x.ad)} (${x.jeton})`).join(' · ')}</div>` : '')
    : `<div class="t1">👑 HALAYBAŞI BOŞ</div><div>İlk hediyeyi atan halaybaşı olur!</div>`;
  $('hedef').querySelector('i').style.width = Math.min(100, hedefT / hedefH * 100) + '%';
  $('hedef').querySelector('span').textContent = `🎯 ${hedefT}/${hedefH} jeton → HAVAİ FİŞEK ŞOVU`;
}
panelYaz();
setTimeout(() => { try { sesAc(); } catch (e) {} }, 1000);   // müzik kendiliğinden başlasın
addEventListener('click', () => { ses?.resume(); muzikEl?.play().catch(() => {}); });

for (let i = 0; i < AYAR.figuran; i++) haltaEkle(kisiOlustur({ id: 'fig' + i, ad: '', figuran: true }));
// boş roller: jetonla alınmayı bekleyen gelin, damat, davulcu, zurnacı
const fiyat = a => (AYAR.hediyeler.find(h => h.aksiyon === a) || {}).jeton;
const bosEtiket = (d, yazi) => { if (d.etiket) d.c.root.remove(d.etiket); d.etiket = etiket(yazi, true); d.c.root.add(d.etiket); };
gelin = kisiOlustur({ id: 'bos-gelin', ad: '', figuran: true }, 'gelin'); bosEtiket(gelin, `GELİN OL · ${fiyat('gelin')} jeton`);
damat = kisiOlustur({ id: 'bos-damat', ad: '', figuran: true }, 'damat'); bosEtiket(damat, `DAMAT OL · ${fiyat('damat')} jeton`);
bosEtiket(muzisyen.davul, `DAVULCU OL · ${fiyat('davul')} jeton`);
bosEtiket(muzisyen.zurna, `ZURNACI OL · ${fiyat('zurna')} jeton`);

/* ---------- Kamera ---------- */
const camPos = new THREE.Vector3(0, 10, 24), camBak = new THREE.Vector3(0, 1, 0);
const hp = new THREE.Vector3(), hb = new THREE.Vector3();
const kamMod = t => Math.floor(t / 8) % 5;   // 8 saniyede bir açı değişir
function kamera(t, dt) {
  const d = kamOdak;
  if (d && d.c.root.parent) {
    const p = d.c.root.position;
    let yx, yz;
    const l = Math.hypot(p.x, p.z) || 1;
    const ortada = d.rol === 'cift' || d.rol === 'muzisyen';
    if (ortada) { yx = p.x / l; yz = p.z / l; } else { yx = -p.x / l; yz = -p.z / l; }
    const uz = (ortada ? 3.4 : Math.min(2.4, R - .3)) * (d.olcek || 1);
    hp.set(p.x + yx * uz, 1.95 * (d.olcek || 1), p.z + yz * uz); hb.set(p.x, 1.2 * (d.olcek || 1), p.z);
    if (gok) { const a = t * .07; hp.set(Math.sin(a) * (R + 5), 1.6, Math.cos(a) * (R + 5)); hb.set(0, 10, 0); }
  } else if (!dansci.length || kamMod(t) === 0) {          // geniş, dönen çekim
    const a = t * .08, uz = R * 1.5 + 7;
    hp.set(Math.sin(a) * uz, 4.5 + R * .3, Math.cos(a) * uz); hb.set(0, 1, 0);
  } else if (kamMod(t) === 2) {          // rastgele bir katılımcıya yakın çekim (adı okunsun)
    const g = dansci.filter(x => !x.figuran), d2 = (g.length ? g : dansci)[Math.floor(t / 8) * 7 % (g.length || dansci.length)];
    const p = d2.c.root.position, l = Math.hypot(p.x, p.z) || 1;
    hp.set(p.x - p.x / l * Math.min(2.2, R - .3), 2.05, p.z - p.z / l * Math.min(2.2, R - .3)); hb.set(p.x, 1.35, p.z);
  } else if (kamMod(t) === 3) {          // halkanın dışından alçak kayan çekim
    const d3 = dansci[Math.floor(dansci.length / 2)], a = d3.a + .35 - (t % 8) * .05, r2 = R + 2.6;
    hp.set(Math.cos(a) * r2, 1.6, Math.sin(a) * r2); hb.set(Math.cos(d3.a) * R, 1.15, Math.sin(d3.a) * R);
  } else if (kamMod(t) === 4) {          // yukarıdan vinç çekimi
    const a = t * .1;
    hp.set(Math.sin(a) * 3, R * 1.6 + 9, Math.cos(a) * 3); hb.set(0, 0, 0);
  } else {                               // halaybaşını takip
    const p = dansci[0].c.root.position, l = Math.hypot(p.x, p.z) || 1, ax = -p.x / l, az = -p.z / l;
    const tx = -az, tz = ax;              // halkanın gidiş yönü
    hp.set(p.x + ax * Math.min(4.5, R - .5) - tx * 2.5, 2.8, p.z + az * Math.min(4.5, R - .5) - tz * 2.5);
    hb.set(p.x + tx * 1.2, 1.1, p.z + tz * 1.2);
  }
  const k = 1 - Math.exp(-dt * (kamOdak ? 5 : 2.2));
  camPos.lerp(hp, k); camBak.lerp(hb, k);
  camera.position.copy(camPos); camera.lookAt(camBak);
}

/* ---------- Döngü ---------- */
let onceki = zaman(), sonVurus = -1, vurus = 0, sonYarim = -1;
function dongu() {
  const t = zaman(), dt = Math.min(.05, t - onceki); onceki = t;
  const hiz = t < hizBitis ? 1.45 : 1; vurus += dt * AYAR.bpm / 60 * hiz; const b = vurus;
  if (muzikEl) muzikEl.playbackRate = hiz;
  const yarim = Math.floor(b * 2);
  if (yarim !== sonYarim) { sonYarim = yarim; if (sesAcik && !AYAR.muzik) { const y = yarim % 8; if ([0, 3, 4].includes(y)) vur(true); else if ([2, 6, 7].includes(y)) vur(false); if (AYAR.zurna) zurnaCal(yarim); } }
  const n = dansci.length;
  const hedefR = Math.max(3, n * ARA / (PI * 2 * .86));
  R += (hedefR - R) * Math.min(1, dt * 1.5);
  taban -= dt * .28 * hiz / R;
  dansci.forEach((d, i) => {
    const hedef = taban + i * ARA / R;
    if (d.a === null) d.a = hedef; else d.a += (hedef - d.a) * Math.min(1, dt * 2.5);
    const r = d.c.root, x = Math.cos(d.a) * R, z = Math.sin(d.a) * R;
    const kt = t - d.dogus;
    if (!d.figuran && d.tip === 'normal' && kt < 1.8) {          // kenardan koşarak gelsin
      if (d.kosuX === undefined) { d.kosuX = Math.cos(d.a) * (R + 8); d.kosuZ = Math.sin(d.a) * (R + 8); }
      const u = Math.min(1, kt / 1.8), e = u * u * (3 - 2 * u);
      r.position.set(d.kosuX + (x - d.kosuX) * e, 0, d.kosuZ + (z - d.kosuZ) * e);
      r.rotation.y = Math.atan2(x - d.kosuX, z - d.kosuZ);
      r.scale.setScalar(d.olcek); pozKos(d.c, t); return;
    }
    r.position.set(x, 0, z); r.rotation.y = Math.atan2(-x, -z);
    const yas = t - d.dogus; d.olcek += ((t < (d.devBitis || 0) ? 1.7 : 1) - d.olcek) * Math.min(1, dt * 3);
    r.scale.setScalar(Math.min(1, .3 + yas * 2.5) * d.olcek);
    const zt = t - d.zipla, zip = zt >= 0 && zt < .5 ? Math.sin(zt / .5 * PI) * .35 : 0;
    pozHalay(d.c, b, i === 0 ? 'bas' : i === n - 1 ? 'son' : '', { zip });
  });
  if (n) { const p = dansci[0].c.root.position; halka.position.set(p.x, .02, p.z); halka.visible = !dansci[0].figuran; }
  // gelin damat ortada
  const ca = t * .25;
  [[gelin, 0], [damat, PI]].forEach(([d, off]) => {
    if (!d) return;
    const r = d.c.root, x = Math.cos(ca + off) * .55, z = Math.sin(ca + off) * .55;
    r.position.set(x, 0, z); r.rotation.y = Math.atan2(-x, -z);
    r.scale.setScalar(Math.min(1, .3 + (t - d.dogus) * 2.5));
    pozCift(d.c, b);
  });
  // müzisyenler
  [[davulcu, PI / 2], [zurnaci, -PI / 2]].forEach(([c, o]) => {      // halkanın ortasında, dışarı bakarak çalıyorlar
    const x = Math.cos(ca + o) * 1.5, z = Math.sin(ca + o) * 1.5;
    c.root.position.set(x, 0, z); c.root.rotation.y = Math.atan2(x, z);
    c.hip.position.y = .94 - .02 * Math.abs(Math.sin(b * PI));
  });
  const vurusF = b % 1, vurusK = Math.exp(-vurusF * 8);
  davulcu.kollar[0].sh.rotation.set(-1.2 + vurusK * .6, 0, -.5 - vurusK * .5); davulcu.kollar[0].el.rotation.set(-1.1 + vurusK, 0, 0);
  davulcu.kollar[1].sh.rotation.set(-1.1, 0, .3); davulcu.kollar[1].el.rotation.set(-1.2, 0, 0);
  for (const i of [0, 1]) { zurnaci.kollar[i].sh.rotation.set(-1.25, 0, i ? .25 : -.25); zurnaci.kollar[i].el.rotation.set(-1.45, 0, i ? -.6 : .6); }
  zurnaci.kafa.rotation.x = .08 * Math.sin(b * PI);

  if (Math.floor(b) !== sonVurus) { sonVurus = Math.floor(b); ampulGuncelle(b); }
  $('sayac').textContent = `HALAY ${dansci.filter(d => !d.figuran).length + (gelin && !gelin.figuran ? 1 : 0) + (damat && !damat.figuran ? 1 : 0)} KİŞİ`;
  olayIsle(t); efektGuncelle(t, dt); kamera(t, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(dongu);
}
dongu();
</script>
